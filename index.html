<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src https://*.meshpay.com; connect-src https://*.meshpay.com;"
    />
    <title>MFS SDK — Electron</title>
    <style>
      /* ---- Dark theme palette ---- */
      :root {
        --bg: #1a1b1e;
        --surface: #25262b;
        --surface-alt: #2c2e33;
        --border: #3a3c42;
        --text: #e9ecef;
        --text-muted: #909296;
        --accent: #5c7cfa;
        --accent-hover: #748ffc;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
      }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; margin-bottom: 12px; }
      button {
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { background: #4a4d55; color: #909296; cursor: not-allowed; }
      #status { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; min-height: 16px; }
      /* ---- Environment segmented switcher ---- */
      .seg {
        display: inline-flex;
        background: var(--surface-alt);
        border-radius: 8px;
        padding: 2px;
        gap: 2px;
      }
      .seg-btn {
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        background: transparent;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .seg-btn:hover { background: rgba(255, 255, 255, 0.06); }
      .seg-btn.is-active {
        color: var(--text);
        background: #3a3c42;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .seg-btn.is-active:hover { background: #3a3c42; }
      /* ---- Destinations editor (drives transferOptions.toAddresses) ---- */
      .dest-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .dest-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .dest-header .dest-label {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
      }
      .dest-count {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        background: var(--surface-alt);
        border-radius: 10px;
        padding: 1px 8px;
      }
      .dest-add-btn {
        margin-left: auto;
        padding: 4px 10px;
        font-size: 12px;
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }
      .dest-add-btn:hover { background: rgba(92, 124, 250, 0.12); }
      .dest-row {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
        align-items: center;
      }
      .dest-row:last-child { margin-bottom: 0; }
      .dest-row select,
      .dest-row input {
        padding: 6px 8px;
        font-size: 12px;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-alt);
        flex: none;
      }
      .dest-row .dest-symbol { width: 90px; }
      .dest-row .dest-network { width: 130px; }
      .dest-row .dest-address {
        flex: 1;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      .dest-remove-btn {
        padding: 4px 9px;
        font-size: 14px;
        line-height: 1;
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      .dest-remove-btn:hover { background: rgba(255, 107, 107, 0.12); color: var(--danger); border-color: var(--danger); }
      .dest-empty-hint { font-size: 12px; color: var(--text-muted); padding: 2px 0; }
      /* The MFS SDK sets its URL as the src of this iframe. */
      #mesh-container {
        display: block;
        margin: 0 auto;
        width: 430px;
        height: 710px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <!-- Destinations editor: each row becomes an entry in
         transferOptions.toAddresses for the Run flow. -->
    <div class="dest-panel">
      <div class="dest-header">
        <span class="dest-label">Destinations</span>
        <span class="dest-count" id="destCount">0</span>
        <button class="dest-add-btn" id="destAddBtn">+ Add</button>
      </div>
      <div id="destRows"></div>
    </div>
    <div class="row" style="justify-content: space-between; align-items: center;">
      <!-- Environment switcher: chooses which MFS creds main.js uses, and
           which Link deployment the SDK's openLink() loads. -->
      <div class="seg" id="envSwitch" role="tablist" aria-label="Environment">
        <button class="seg-btn" data-env="production" aria-selected="false">Production</button>
        <button class="seg-btn is-active" data-env="sandbox" aria-selected="true">Sandbox</button>
      </div>
      <button id="runBtn">New Session</button>
    </div>
    <div id="status"></div>
    <!-- sandbox: Link gets scripts, its own origin, forms and popups, but not
         allow-top-navigation, so it cannot replace this page. -->
    <iframe
      id="mesh-container"
      title="Mesh Link"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
    ></iframe>

    <script src="dist/renderer.js"></script>
  </body>
</html>
